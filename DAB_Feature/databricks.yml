# This is a Declarative Automation Bundle definition for DAB_Feature.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: DAB_Feature
  uuid: d91cddac-c0ae-4ed2-97f1-874539a980c7

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-9e44566b-8d3a.cloud.databricks.com
    variables:
      catalog: mycatalog_dev
      schema: default
  prod:
    mode: production
    workspace:
      host: https://dbc-9e44566b-8d3a.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/mohammad.syed@capgemini.com to make sure we only have a single copy.
      root_path: /Workspace/Users/mohammad.syed@capgemini.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: mycatalog_prod
      schema: prod
    permissions:
      - user_name: mohammad.syed@capgemini.com
        level: CAN_MANAGE
